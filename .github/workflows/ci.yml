name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  OPENROUTER_API_KEY: test-key
  FAL_KEY: ""
  REDIS_URL: ""
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ── 2. Server-only boundary check ────────────────────────────────────────
  server-only-check:
    name: "🔒 Server-only boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all lib/ files have import "server-only"
        run: bash scripts/check-server-only.sh

  # ── 3. TypeScript ────────────────────────────────────────────────────────
  type-check:
    name: "🔷 TypeScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ── 4. Production Build ──────────────────────────────────────────────────
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Next.js production build
        run: npm run build

  # ── 5. Component Tests (React / jsdom) ───────────────────────────────────
  component-tests:
    name: "🧩 Component Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component

  # ── 6. Unit & API Tests (with coverage) ──────────────────────────────────
  unit-tests:
    name: "🧪 Unit & API Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          mkdir -p test-results
          npm run test:coverage -- \
            --reporter=verbose \
            --reporter=json \
            --outputFile=test-results/unit-results.json

      - name: Write test summary
        if: always()
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          FILE="test-results/unit-results.json"
          echo "## 🧪 Unit & API Tests — $DATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$FILE" ]; then
            node -e "
              const r = require('./test-results/unit-results.json');
              const total   = r.numTotalTests    || 0;
              const passed  = r.numPassedTests   || 0;
              const failed  = r.numFailedTests   || 0;
              const skipped = r.numPendingTests  || 0;
              const status  = failed === 0 ? 'All tests passed' : failed + ' test(s) failed';
              const icon    = failed === 0 ? '✅' : '❌';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Status | ' + icon + ' ' + status + ' |');
              console.log('| ✅ Passed | ' + passed + ' |');
              console.log('| ❌ Failed | ' + failed + ' |');
              console.log('| ⏭️ Skipped | ' + skipped + ' |');
              console.log('| 📦 Total | ' + total + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Result file not found" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const p = function(k) { return c[k] ? c[k].pct.toFixed(1) + '%' : 'n/a'; };
              console.log('| Lines | Statements | Functions | Branches |');
              console.log('|-------|------------|-----------|----------|');
              console.log('| ' + p('lines') + ' | ' + p('statements') + ' | ' + p('functions') + ' | ' + p('branches') + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}-${{ github.sha }}
          path: coverage/
          retention-days: 30

  # ── 6b. Eval harness — deterministic tier (no network, no secrets) ───────
  # Tier 2 (live LLM judge) is a separate manually-triggered workflow:
  # .github/workflows/eval-live.yml
  eval-harness:
    name: "⚖️ Eval Harness (dry)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run BEFORE the smoke steps: if the harness no longer sends the
      # production prompt, everything downstream measures the wrong system.
      - name: Prompt parity (harness prompts == production prompts)
        run: npm run eval:parity

      - name: Eval-data integrity (committed reference artifacts)
        run: npm run eval:ci

      - name: Trace pipeline smoke (dry-run, no network)
        run: npm run eval:traces:dry -- --limit 2 --runs 1

      - name: Judge pipeline smoke (dry-run, no network)
        run: npm run eval:judge:dry -- --limit 20

  # ── 7. Pipeline summary ──────────────────────────────────────────────────
  summary:
    name: "📋 Report"
    runs-on: ubuntu-latest
    needs: [lint, server-only-check, type-check, build, component-tests, unit-tests]
    if: always()
    steps:
      - name: Write pipeline report
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          LINT="${{ needs.lint.result }}"
          SERVER_ONLY="${{ needs.server-only-check.result }}"
          TYPES="${{ needs.type-check.result }}"
          BUILD="${{ needs.build.result }}"
          COMPONENT="${{ needs.component-tests.result }}"
          UNIT="${{ needs.unit-tests.result }}"

          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          if [ "$LINT" = "success" ] && [ "$SERVER_ONLY" = "success" ] && [ "$TYPES" = "success" ] && [ "$BUILD" = "success" ] && [ "$COMPONENT" = "success" ] && [ "$UNIT" = "success" ]; then
            OVERALL="✅ All checks passed"
          else
            OVERALL="❌ Pipeline failed"
          fi

          echo "# 📋 CI Report — $DATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### $OVERALL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint           | $(icon $LINT) \`$LINT\`            |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Server-only    | $(icon $SERVER_ONLY) \`$SERVER_ONLY\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔷 TypeScript     | $(icon $TYPES) \`$TYPES\`          |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build          | $(icon $BUILD) \`$BUILD\`          |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧩 Components     | $(icon $COMPONENT) \`$COMPONENT\`  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit & API     | $(icon $UNIT) \`$UNIT\`            |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · \`${{ github.ref_name }}\` · \`${GITHUB_SHA::7}\`_" >> $GITHUB_STEP_SUMMARY
